[project]
name = "ai-engineer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "groq>=0.9.0",
    "ipykernel>=7.3.0",
    "openai>=2.44.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "streamlit>=1.58.0",
    "cohere>=5.11.0",
]

[tool.uv.workspace]
members = [
    "app/api",
    "app/chatbot_ui",
]

[dependency-groups]
dev = [
    "langchain-community>=0.4.2",
    "langchain-groq>=0.2.0",
    "langchain-cohere>=0.3.0",
    "langgraph>=1.2.10",
    "langsmith>=0.10.15",
    "matplotlib>=3.11.1",
    "qdrant-client>=1.18.0",
    "ragas>=0.4.3",
]
