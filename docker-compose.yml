services:
  streamlit-app:
    build:
      context: .
      dockerfile: app/chatbot_ui/Dockerfile
    ports:
      - 8501:8501
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./app/chatbot_ui/src:/app/src

  api:
    build:
      context: .
      dockerfile: app/api/Dockerfile
    ports:
      - 8000:8000
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./app/api/src:/app/app/api/src